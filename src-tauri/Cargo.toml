[package]
name = "idit"
version = "0.1.0"
description = "iDit — 코드 에디터"
authors = ["IDOIT Inc."]
edition = "2021"

[lib]
name = "idit_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "fs"] }
base64 = "0.22"
encoding_rs = "0.8"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idit_check)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
